<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' style='background:transparent'><text y='.9em' font-size='90'>📊</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macro Cycle Tracker — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">
  <!-- Site Header -->
    <!-- Live Ticker Tape -->
  <div class="ticker-bar">
    <div class="tradingview-widget-container" style="height:46px">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName":"FOREXCOM:SPXUSD","title":"S\u0026P 500"},
          {"proName":"DJ:DJI","title":"Dow Jones"},
          {"proName":"FOREXCOM:NSXUSD","title":"NASDAQ 100"},
          {"proName":"BITSTAMP:BTCUSD","title":"Bitcoin"},
          {"proName":"BITSTAMP:ETHUSD","title":"Ethereum"},
          {"proName":"COINBASE:SOLUSD","title":"Solana"},
          {"proName":"TVC:GOLD","title":"Gold"},
          {"proName":"TVC:US10Y","title":"10Y Yield"},
          {"proName":"ECONOMICS:USINTR","title":"Fed Rate"},
          {"proName":"FOREXCOM:DXY","title":"US Dollar"}
        ],
        "showSymbolLogo": true,
        "isTransparent": false,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <header id="site-header" class="site-header text-white shadow-lg sticky top-0 z-50"></header>

  <!-- Season Key Bar -->
  <div id="season-key-bar" class="overflow-x-auto sticky top-14 z-40">
    <div id="phase-pills" class="flex min-w-max px-2"></div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Season Display Card -->
    <div id="season-card" class="season-card p-6 rounded-xl">
      <div class="flex items-center gap-4">
        <div class="loading-shimmer h-14 w-14 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="loading-shimmer h-7 w-48 rounded"></div>
          <div class="loading-shimmer h-4 w-full rounded"></div>
          <div class="loading-shimmer h-4 w-3/4 rounded"></div>
        </div>
      </div>
      <div class="mt-4 flex items-center gap-2 text-sm text-gray-400">
        <svg class="animate-spin h-4 w-4 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span id="loading-status">Connecting to server…</span>
      </div>
    </div>

    <!-- Two column: FOMC + Quick Portfolio -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- FOMC Timeline -->
      <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
          <span>🏦</span> FOMC Calendar 2026
        </h2>
        <div id="fomc-timeline" class="flex gap-2 overflow-x-auto pb-2">
          <div class="loading-shimmer h-16 w-20 rounded flex-shrink-0"></div>
          <div class="loading-shimmer h-16 w-20 rounded flex-shrink-0"></div>
          <div class="loading-shimmer h-16 w-20 rounded flex-shrink-0"></div>
        </div>
        <div id="fomc-next-detail" class="mt-3 text-sm text-gray-600"></div>
      </div>

      <!-- Mini Portfolio -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
          <span>💼</span> Portfolio
        </h2>
        <canvas id="mini-donut" width="160" height="160" class="mx-auto block"></canvas>
        <div id="portfolio-legend" class="mt-3 space-y-1 text-sm"></div>
        <a href="/playbook.html" class="mt-4 block text-center text-sm font-medium py-2 px-4 rounded-lg text-white" style="background: var(--season-primary)">
          View Full Playbook →
        </a>
      </div>
    </div>

    <!-- Key Rates Grid -->
    <div>
      <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
        <span>📈</span> Key Rates
      </h2>
      <div id="rates-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Indicators -->
    <div>
      <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
        <span>📊</span> Key Indicators
      </h2>
      <div id="indicators-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Season Scoring + Prediction -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Season Scores -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
          <span>🎯</span> Season Scoring
        </h2>
        <div id="season-scores" class="space-y-3">
          <!-- Populated by JS -->
        </div>
        <div id="conflicting-indicators" class="mt-4 text-xs text-gray-500"></div>
      </div>

      <!-- Prediction -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
        <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
          <span>🔮</span> What to Watch Next
        </h2>
        <div id="prediction-card" class="space-y-3">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Detected Overlays -->
    <div id="overlays-section" class="hidden">
      <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">
        <span>⚠️</span> Active Overlays
      </h2>
      <div id="overlays-list" class="space-y-2"></div>
    </div>

    <!-- Stale data warning -->
    <div id="stale-warning" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-3 text-amber-800 text-sm flex items-center gap-2">
      <span>⚠️</span>
      <span>Showing cached data — FRED API unavailable. <a href="/api/refresh" class="underline font-medium">Try refreshing</a>.</span>
    </div>

    <!-- Refresh button -->
    <div class="flex items-center justify-between text-sm text-gray-500">
      <span id="last-updated"></span>
      <button id="refresh-btn" class="flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 hover:border-gray-300 transition-colors">
        <span>🔄</span> Refresh Data
      </button>
    </div>

  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
