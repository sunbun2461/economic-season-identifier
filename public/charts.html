<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' style='background:transparent'><text y='.9em' font-size='90'>📊</text></svg>">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macro Cycle Tracker — Charts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">

    <!-- Live Ticker Tape -->
  <div class="ticker-bar">
    <div class="tradingview-widget-container" style="height:46px">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName":"FOREXCOM:SPXUSD","title":"S\u0026P 500"},
          {"proName":"DJ:DJI","title":"Dow Jones"},
          {"proName":"FOREXCOM:NSXUSD","title":"NASDAQ 100"},
          {"proName":"BITSTAMP:BTCUSD","title":"Bitcoin"},
          {"proName":"BITSTAMP:ETHUSD","title":"Ethereum"},
          {"proName":"COINBASE:SOLUSD","title":"Solana"},
          {"proName":"TVC:GOLD","title":"Gold"},
          {"proName":"TVC:US10Y","title":"10Y Yield"},
          {"proName":"ECONOMICS:USINTR","title":"Fed Rate"},
          {"proName":"FOREXCOM:DXY","title":"US Dollar"}
        ],
        "showSymbolLogo": true,
        "isTransparent": false,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <header id="site-header" class="site-header text-white shadow-lg sticky top-0 z-50"></header>

  <div id="season-key-bar" class="overflow-x-auto sticky top-14 z-40">
    <div id="phase-pills" class="flex min-w-max px-2"></div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <div class="flex items-center justify-between mb-5 flex-wrap gap-4">
      <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
        <span>📊</span> TradingView Chart Links
      </h1>
      <div class="flex gap-2 flex-wrap" id="category-filters">
        <button class="filter-btn active text-xs px-3 py-1.5 rounded-full border font-medium transition-all" data-cat="">All</button>
      </div>
    </div>

    <div id="charts-container" class="space-y-8">
      <div class="loading-shimmer h-32 rounded-xl"></div>
    </div>

    <div class="mt-6 text-xs text-gray-500 text-center">
      All links open TradingView in a new tab. Data is from the St. Louis Fed (FRED) and other public sources.
    </div>

  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/charts.js"></script>
</body>
</html>
