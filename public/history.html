<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macro Cycle Tracker — Rate History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">

  <header id="site-header" class="site-header text-white shadow-lg sticky top-0 z-50"></header>

  <div id="season-key-bar" class="overflow-x-auto sticky top-14 z-40">
    <div id="phase-pills" class="flex min-w-max px-2"></div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
        <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
          <span>📜</span> 35 Years of Fed Rate Decisions
        </h1>
        <!-- Summary stats -->
        <div id="stats-bar" class="flex gap-4 text-sm">
          <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full font-medium">Cuts: <span id="stat-cuts">—</span></span>
          <span class="px-3 py-1 bg-red-100 text-red-800 rounded-full font-medium">Hikes: <span id="stat-hikes">—</span></span>
          <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full font-medium">Holds: <span id="stat-holds">—</span></span>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-3 mb-5">
        <div>
          <label class="text-xs font-medium text-gray-500 block mb-1">Decade</label>
          <select id="filter-decade" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5">
            <option value="">All</option>
            <option value="1990s">1990s</option>
            <option value="2000s">2000s</option>
            <option value="2010s">2010s</option>
            <option value="2020s">2020s</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 block mb-1">Chair</label>
          <select id="filter-chair" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5">
            <option value="">All</option>
            <option value="Greenspan">Greenspan</option>
            <option value="Bernanke">Bernanke</option>
            <option value="Yellen">Yellen</option>
            <option value="Powell">Powell</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 block mb-1">Direction</label>
          <select id="filter-direction" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5">
            <option value="">All</option>
            <option value="cut">Cuts</option>
            <option value="hike">Hikes</option>
            <option value="hold">Holds</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 block mb-1">Season</label>
          <select id="filter-season" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5">
            <option value="">All</option>
            <option value="spring">🌱 Spring</option>
            <option value="summer">☀️ Summer</option>
            <option value="autumn">🍂 Autumn</option>
            <option value="winter">❄️ Winter</option>
          </select>
        </div>
        <div class="flex items-end">
          <button id="filter-clear" class="text-sm px-3 py-1.5 border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50">
            Clear Filters
          </button>
        </div>
        <div class="flex items-end ml-auto">
          <span id="filter-count" class="text-sm text-gray-500"></span>
        </div>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="border-b-2 border-gray-200">
              <th class="text-left py-2 px-3 font-semibold text-gray-600">Date</th>
              <th class="text-left py-2 px-3 font-semibold text-gray-600">Chair</th>
              <th class="text-right py-2 px-3 font-semibold text-gray-600">From</th>
              <th class="text-right py-2 px-3 font-semibold text-gray-600">To</th>
              <th class="text-center py-2 px-3 font-semibold text-gray-600">Change</th>
              <th class="text-left py-2 px-3 font-semibold text-gray-600">Season</th>
              <th class="text-left py-2 px-3 font-semibold text-gray-600">Note</th>
            </tr>
          </thead>
          <tbody id="history-tbody">
            <tr><td colspan="7" class="py-8 text-center text-gray-400">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
